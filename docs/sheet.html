<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popcorn — all scenes</title>
<style>
  body { margin: 0; padding: 20px; background: #101012; font: 12px/1.3 -apple-system, system-ui, sans-serif; color: #ddd; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  figure { margin: 0; }
  img { width: 100%; display: block; border-radius: 8px; }
  figcaption { padding-top: 5px; color: #b9b9c0; letter-spacing: .08em; text-transform: uppercase; font-size: 10px; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script>
  var scenes = ["arrakis","upside-down","digital-rain","off-world","macrodata","black-lodge","night-drive","gargantua","trinity","wasteland","cordyceps","the-down-deep","terminus","redwood","dragonstone","nine-nine","rolling-stone","grand-pastel","plastic-pink","nevermore","glitter","yes-chef"];
  document.getElementById("g").innerHTML = scenes.map(function (s) {
    return '<figure><img src="previews/' + s + '.png"><figcaption>' + s.replace(/-/g, " ") + '</figcaption></figure>';
  }).join("");
</script>
</body>
</html>
